name: Fetch Wheels and Run Tests

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to fetch (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch-wheels:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
    steps:
      - name: Download wheels from private repo release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          mkdir -p wheels

          gh release download ${{ inputs.version }} \
            --repo UnravelSports/fast-forward-rs \
            --pattern "*.whl" \
            --dir wheels/ \
            --clobber

          echo "Downloaded wheels:"
          ls -la wheels/

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/*.whl
          retention-days: 1

  run-tests:
    needs: fetch-wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clean old wheels
        shell: bash
        run: rm -f wheels/*.whl

      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # NOTE: pyspark / dask / ray are deliberately NOT installed here.
        # The engine='arrow' worker-safety contract requires the bytes path
        # to import and run without any distributed framework present.
        # The arrow tests run against this stripped env; do not add
        # pyspark/dask/ray "for completeness" or you'll silently break
        # the contract. (test_arrow_output.py / test_arrow_schema.py
        # must pass here.)
        run: pip install "kloppy>=3.18.0" pyarrow

      - name: Install wheel
        run: pip install --find-links wheels/ fast-forward-football

      - name: Verify installation
        run: |
          pip show fast-forward-football
          python -c "from fastforward import secondspectrum; print('fastforward imported successfully')"

      - name: Install test dependencies
        run: pip install pytest

      # Test data lives in the private repo, never here. Take it from the release tag
      # the wheels were built from, so tests and data match that release. Only
      # tests/files/ is checked out, minus the fixtures of Rust-only surfaces that no
      # public test reads (this runner's logs are public), and the token isn't left in
      # test-data/.git while pytest and third-party packages run.
      - name: Fetch test data from private repo
        uses: actions/checkout@v4
        with:
          repository: UnravelSports/fast-forward-rs
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.version }}
          path: test-data
          sparse-checkout: |
            /tests/files/
            !/tests/files/versa_*
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Without the data, tests/config.py skips every module that needs it, so every
      # file it names must exist here, or the run would pass as a run of skips.
      - name: Run tests
        shell: bash
        env:
          FASTFORWARD_TEST_DATA: ${{ github.workspace }}/test-data/tests/files
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "tests")
          import config  # raises if the data folder is missing
          root = str(config.DATA_DIR)
          missing = [v for k, v in vars(config).items()
                     if k.isupper() and isinstance(v, str) and v.startswith(root) and not os.path.exists(v)]
          if missing:
              sys.exit("test data missing: " + ", ".join(missing))
          EOF
          pytest tests/ -v -o "pythonpath="

  create-release:
    needs: run-tests
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels/

      - name: Create release with wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ inputs.version }} \
            wheels/*.whl \
            --repo ${{ github.repository }} \
            --title "Release ${{ inputs.version }}" \
            --generate-notes

  publish-pypi:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: wheels/
